services:
  # FastAPI Web Service
  - type: web
    name: job-queue-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: API_KEY
        sync: false   # set this manually in Render dashboard
      - key: REDIS_URL
        sync: false   # Optional - use Upstash Redis free tier or leave empty for in-memory fallback
      - key: RATE_LIMIT_REQUESTS
        value: 10
      - key: RATE_LIMIT_WINDOW
        value: 60

  # Worker runs as a web service on free tier
  # It exposes a minimal /health endpoint to keep Render happy
  - type: web
    name: job-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

databases:
  - name: job-queue-db
    databaseName: job_db
    plan: free
