services:
  # FastAPI Web Service — handles HTTP requests
  - type: web
    name: job-queue-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  # Background Worker — consumes RabbitMQ messages, no HTTP port needed
  - type: worker
    name: job-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

databases:
  - name: job-queue-db
    databaseName: job_db
    plan: free
