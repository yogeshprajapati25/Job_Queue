services:
  # FastAPI Web Service
  - type: web
    name: job-queue-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  # Worker runs as a web service on free tier
  # It exposes a minimal /health endpoint to keep Render happy
  - type: web
    name: job-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

databases:
  - name: job-queue-db
    databaseName: job_db
    plan: free
