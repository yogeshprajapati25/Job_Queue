services:
  # 1. FastAPI Web Service
  - type: web
    name: job-queue-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false   # Manually set in Render Dashboard

  # 2. Worker Service (Deployed as 'web' type to use Free plan)
  - type: web
    name: job-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: python -m worker.consumer
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false   # Manually set in Render Dashboard

databases:
  - name: job-queue-db
    plan: free