services:
  # 1. FastAPI Web Service
  - type: web
    name: job-queue-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

  # 2. Background Worker
  - type: web
    name: job-queue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m worker.consumer
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-queue-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false

databases:
  - name: job-queue-db
    plan: free